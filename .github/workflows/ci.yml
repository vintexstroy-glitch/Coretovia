name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  proverka:
    name: Пълната проверка · типове · тестове · чистота · честност · слоеве · лицензи · стил · проход
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # ЕДНА стъпка, не изброени. Изброяването се разминава: `npm run proverka`
      # порасна на ДЕВЕТ порти, а тук стояха седем — `knip` и `dumi:proveri` не
      # се пускаха НИКЪДЕ, а вторият пази неговите думи от Книгата, не чистотата.
      # Домът на списъка е `package.json`; тук се ВИКА, не се преписва (правило 17).
      - name: Пълната проверка · деветте порти
        run: npm run proverka

      - name: Браузър за прохода
        run: npx playwright-core install --with-deps chromium

      # Проходът проверява какво ПИШЕ НА ЕКРАНА. Без него регресия в изгледа
      # минава зелено.
      - name: Проход през истински браузър
        run: npm run proba
